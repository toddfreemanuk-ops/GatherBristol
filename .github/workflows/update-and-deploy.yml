name: Update listings and deploy

on:
  schedule:
    - cron: '20 5 * * *'   # every day at 05:20 UTC
  workflow_dispatch:        # the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read   # lets the deploy step look up the uploaded site bundle

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # A push only redeploys what is already in the repository; the scrape runs on the schedule or the button.
      - name: Refresh listings
        if: github.event_name != 'push'
        run: |
          pip install --quiet pillow
          python scripts/daily_update.py

      - name: Save the refreshed listings
        if: github.event_name != 'push'
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add -A site source work
          git diff --cached --quiet || git commit -m "Daily listings refresh"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Deploying straight after the upload can fail with "No artifacts named github-pages were found": GitHub has not
      # registered the upload yet (actions/deploy-pages issue 451). So wait, and if it still fails, wait longer and try once more.
      - run: sleep 30
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
